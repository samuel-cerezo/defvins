name: docker-build

on:
  push:
    branches: [main, docker-and-docs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Third-party layer (apt + Ceres + Pangolin + nonmin-pose) is cached in
      # the GitHub Actions cache, so normal runs only recompile DefVINS.
      - name: Build image (dependencies + DefVINS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: defvins:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm defvins:ci --help
          docker run --rm --entrypoint bash defvins:ci -c '
            set -e
            test -x /opt/defvins/build/defvins
            ldd /opt/defvins/build/defvins | (! grep "not found")
            python3 -c "import sys; sys.path.insert(0, \"/opt/defvins/scripts\"); import nonmin_pose_wrapper"
            # no args -> usage message and exit code 255 (-1)
            set +e; defvins > /tmp/out.txt 2>&1; rc=$?; set -e
            cat /tmp/out.txt; test $rc -eq 255
          '
