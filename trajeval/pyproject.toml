[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trajeval"
version = "0.2.0"
description = "Evaluate mobile-robot and SLAM trajectories against a reference (ATE, RPE, lateral/longitudinal/heading errors)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samuel Cerezo" }]
keywords = ["slam", "odometry", "trajectory", "evaluation", "robotics", "ate", "rpe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
trajeval = "trajeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
